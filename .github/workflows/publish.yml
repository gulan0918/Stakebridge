name: Validate, build and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stakebridge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      pages_enabled: ${{ steps.pages-state.outputs.enabled }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:registry
      - run: pnpm test
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: stakebridge-dist
          path: dist
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist
      - name: Check Pages configuration
        id: pages-state
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            try {
              const result = await github.rest.repos.getPages(context.repo);
              const enabled = result.data.build_type === 'workflow';
              core.setOutput('enabled', String(enabled));
              if (!enabled) core.notice('Choose Settings → Pages → Source → GitHub Actions, then rerun this workflow to publish.');
            } catch (error) {
              if (error.status !== 404 && error.status !== 403) throw error;
              core.setOutput('enabled', 'false');
              core.notice('Build is ready. Choose Settings → Pages → Source → GitHub Actions, then rerun this workflow to publish.');
            }

  deploy:
    if: needs.build.outputs.pages_enabled == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
